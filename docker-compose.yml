version: "3.8"

services:
  ### Web App (React + .NET Core API)
  heroscapebuilder:
    image: heroscapebuilder:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+
      - HeroscapeBuilder=${HeroscapeBuilder}
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
    networks:
      - webnet

  ### MinIO Storage Service
  minio1:
    image: minio/minio
    command: server --address ":9000" --console-address ":9081" http://minio1/data http://minio2/data
    environment:
      - MINIO_ACCESS_KEY=5Y5aCgFi@SF7!dMeMlJ$$
      - MINIO_SECRET_KEY=K@VW7s$$!r6bj&fC57rMtqy3v9sVA$$3v^gNbbsh4R
    volumes:
      - /mnt/minio_storage/data:/data
    networks:
      - internal_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.hostname == projectmaster
    ports:
      - "2096:9000"
      - "9081:9081"

  minio2:
    image: minio/minio
    command: server --address ":9000" --console-address ":9081" http://minio1/data http://minio2/data
    environment:
      - MINIO_ACCESS_KEY=5Y5aCgFi@SF7!dMeMlJ$$
      - MINIO_SECRET_KEY=K@VW7s$$!r6bj&fC57rMtqy3v9sVA$$3v^gNbbsh4R
    volumes:
      - /mnt/minio_storage/data:/data
    networks:
      - internal_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.hostname == elitedesk
    ports:
      - "2097:9000"
      - "9082:9081"

  ### Nginx Reverse Proxy for MinIO
  nginx:
    image: nginx
    volumes:
      - /nginx.conf:/etc/nginx/nginx.conf:ro
      - /heroscapebuilder-certs:/certs
    ports:
      - "8012:80"
      - "8043:443"
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
    networks:
      - webnet
      - internal_network


networks:
  webnet:
    driver: overlay
  internal_network:
    driver: overlay
    attachable: true
