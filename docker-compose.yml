version: '3.8'
services:
  heroscapebuilder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_URLS=http://+
      - HeroscapeBuilder=/app/config/HeroscapeBuilder.config.json  # Path within the container
    volumes:
      - ./HeroscapeBuilder.config.json:/app/config/HeroscapeBuilder.config.json  # Mount file in container
