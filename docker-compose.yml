version: "3.8"

services:
  ### Web App (React + .NET Core API)
  heroscapebuilder:
    image: heroscapebuilder:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"    # Internal HTTP port for .NET Core
      - "5001:443"   # Internal HTTPS port for .NET Core      
      - "5002:5173"   # Internal HTTPS port for .NET Core
    environment:
      - ASPNETCORE_URLS=http://+:80
      - HeroscapeBuilder=${HeroscapeBuilder}
    deploy:
      mode: replicated
      replicas: 2
    networks:
      - webnet

  ### MinIO Storage Service
  minio:
    image: minio/minio
    command: server --certs-dir /certs --address ":9000" --console-address ":9081" /data
    environment:
      - MINIO_ACCESS_KEY=5Y5aCgFi@SF7!dMeMlJ$$
      - MINIO_SECRET_KEY=K@VW7s$$!r6bj&fC57rMtqy3v9sVA$$3v^gNbbsh4R
    volumes:
      - /mnt/minio_storage/data:/data
      - /mnt/minio_storage/certs:/certs
    networks:
      - internal_network
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
    ports:
      - "2096:9000"  # MinIO API
      - "9081:9081"  # MinIO Web UI

  ### Nginx Reverse Proxy
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Ensure this file is in the same directory
    ports:
      - "8012:8012"  # External HTTP, matches router port forwarding
      - "8043:8043"  # External HTTPS, matches router port forwarding
    deploy:
      mode: replicated
      replicas: 2
    networks:
      - webnet
      - internal_network

networks:
  webnet:
    driver: overlay
  internal_network:
    driver: overlay
    attachable: true
