# See .env file for passwords to SQL and Minio
services:
  heroscapebuilder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_URLS=http://+
      - HeroscapeBuilder=${HeroscapeBuilder}
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge