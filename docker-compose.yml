version: "3.8"

services:
  heroscapebuilder:
    image: abnoba12/heroscapebuilder
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
      - DOTNET_gcServer=1
      - DOTNET_ReadyToRun=1
      - DOTNET_TieredPGO=1
      - HeroscapeBuilder=${HeroscapeBuilder}
    networks:
      - internal_network
      - shared_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server --address ":9000" --console-address ":9081" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://files.heroscapebuilder.com"
      MINIO_BROWSER_REDIRECT_URL: "http://minio-console.local"
      MINIO_UPLOAD_PART_SIZE: 1G
      MINIO_MAX_OBJECT_SIZE: 1G
    volumes:
      - /home/abnoba12/Sync/minio_storage/data:/data
    ports:
      - "2096:9000"
      - "9081:9081"
    networks:
      - internal_network
    restart: unless-stopped

  nginx:
    image: nginx
    volumes:
      - /home/abnoba12/Sync/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/abnoba12/Sync/heroscapebuilder-certs:/certs
    ports:
      - "80:80"
      - "443:443"
      - "8012:80"
      - "8043:443"
    networks:
      - internal_network
    restart: unless-stopped

networks:
  internal_network:
    driver: bridge
  shared_network:
    external: true