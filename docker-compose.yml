version: "3.8"

services:
  ### Web App (React + .NET Core API)
  heroscapebuilder:
    image: abnoba12/heroscapebuilder
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+
      - HeroscapeBuilder=${HeroscapeBuilder}
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
    networks:
      - internal_network

  ### MinIO Storage Service - Node 1
  # minio1:
    # image: minio/minio
    # hostname: minio1
    # command: server --address ":9000" --console-address ":9081" http://minio1/data http://minio2/data
    # environment:
      # - MINIO_ROOT_USER=Hassle864
      # - MINIO_ROOT_PASSWORD=6vMAidQ4RvYRSJJ5yg5FAgAJgi3Hi2
      # - MINIO_DISTRIBUTED_MODE_ENABLED="yes"
      # - MINIO_DISTRIBUTED_NODES=minio1,minio2
      # - MINIO_SERVER_URL=http://files.heroscapebuilder.com
      # - MINIO_BROWSER_REDIRECT_URL=http://minio-console.local
      # - MINIO_UPLOAD_PART_SIZE=1G
      # - MINIO_MAX_OBJECT_SIZE=1G
    # volumes:
      # - /mnt/minio_storage/data:/data
    # networks:
      # - internal_network
    # deploy:
      # mode: global
      # placement:
        # constraints:
          # - node.hostname == projectmaster
    # ports:
      # - "2096:9000"
      # - "9081:9081"

  ### MinIO Storage Service - Node 2
  # minio2:
    # image: minio/minio
    # hostname: minio2
    # command: server --address ":9000" --console-address ":9081" http://minio1/data http://minio2/data
    # environment:
      # - MINIO_ROOT_USER=Hassle864
      # - MINIO_ROOT_PASSWORD=6vMAidQ4RvYRSJJ5yg5FAgAJgi3Hi2
      # - MINIO_DISTRIBUTED_MODE_ENABLED="yes"
      # - MINIO_DISTRIBUTED_NODES=minio1,minio2
      # - MINIO_SERVER_URL=http://files.heroscapebuilder.com
      # - MINIO_BROWSER_REDIRECT_URL=http://minio-console.local
      # - MINIO_UPLOAD_PART_SIZE=1G
      # - MINIO_MAX_OBJECT_SIZE=1G
    # volumes:
      # - /mnt/minio_storage/data:/data
    # networks:
      # - internal_network
    # deploy:
      # mode: global
      # placement:
        # constraints:
          # - node.hostname == elitedesk
    # ports:
      # - "2097:9000"
      # - "9082:9081"
      
  minio:
    image: minio/minio:latest
    hostname: "minio{{.Task.Slot}}"
    # The command lists both endpoints so that each instance knows about its peers.
    # With two replicas, one will resolve to "minio1" and the other to "minio2".
    command: server --address ":9000" --console-address ":9081" http://minio{1...2}/data{1...2}
    environment:
      - MINIO_ROOT_USER: Hassle864
      - MINIO_ROOT_PASSWORD: 6vMAidQ4RvYRSJJ5yg5FAgAJgi3Hi2
      - MINIO_DISTRIBUTED_MODE_ENABLED: "yes"
      #- MINIO_SERVER_URL: "http://files.heroscapebuilder.com"
      #- MINIO_BROWSER_REDIRECT_URL: "http://minio-console.local"
      - MINIO_UPLOAD_PART_SIZE: 1G
      - MINIO_MAX_OBJECT_SIZE: 1G
    volumes:
      - /mnt/minio_storage/data1:/data1
      - /mnt/minio_storage/data2:/data2
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
    ports:
      - target: 9000
        published: 2096
        protocol: tcp
      - target: 9081
        published: 9081
        protocol: tcp
    networks:
      - internal_network

  ### Nginx Reverse Proxy for MinIO
  nginx:
    image: nginx
    volumes:
      - /nginx.conf:/etc/nginx/nginx.conf:ro
      - /heroscapebuilder-certs:/certs
    ports:
      - "8012:80"
      - "8043:443"
      - "80:80"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.hostname == projectmaster
    networks:
      - internal_network


networks:
  internal_network:
    driver: overlay
    attachable: true
