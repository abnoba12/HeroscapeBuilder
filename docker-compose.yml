version: "3.8"

services:
  ### Web App (React + .NET Core API)
  heroscapebuilder:
    image: heroscapebuilder:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8012:80"
      - "8043:5173"
    environment:
      - ASPNETCORE_URLS=http://+
      - HeroscapeBuilder=${HeroscapeBuilder}
    volumes:
      - ~/heroscapebuilder-certs:/certs
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
    networks:
      - webnet

  ### MinIO Storage Service
  minio:
    image: minio/minio
    command: server --certs-dir /certs --address ":9000" --console-address ":9081" /data
    environment:
      - MINIO_ACCESS_KEY=5Y5aCgFi@SF7!dMeMlJ$$
      - MINIO_SECRET_KEY=K@VW7s$$!r6bj&fC57rMtqy3v9sVA$$3v^gNbbsh4R
    volumes:
      - /mnt/minio_storage/data:/data
      - /mnt/minio_storage/certs:/certs
    networks:
      - internal_network
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
    ports:
      - "2096:9000"  # MinIO API
      - "9081:9081"  # MinIO Web UI

  ### Nginx Reverse Proxy for MinIO
  nginx:
    image: nginx
    volumes:
      - /nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
    networks:
      - webnet
      - internal_network


networks:
  webnet:
    driver: overlay
  internal_network:
    driver: overlay
    attachable: true
